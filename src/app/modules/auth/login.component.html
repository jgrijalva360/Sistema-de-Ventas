<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-box">🛒</div>
      <h1>STOCKUP</h1>
      <p>Ingresa a tu punto de venta en la nube</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input #emailInputRef id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@correo.com"
          required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          minlength="6" autocomplete="current-password" />
      </div>

      @if (errorMessage()) {
      <div class="alert-error">
        {{ errorMessage() }}
      </div>
      }

      @if (successMessage()) {
      <div class="alert-success">
        {{ successMessage() }}
      </div>
      }

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
          @if (loading()) {
          <span>Iniciando sesión...</span>
          } @else {
          <span>🔐 Iniciar Sesión</span>
          }
        </button>
      </div>

      <div class="login-footer" style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
        <button type="button" class="link-btn" (click)="onForgotPassword()">
          ¿Olvidaste tu contraseña?
        </button>
        <a routerLink="/" style="color: #0284c7; font-size: 0.85rem; font-weight: 700; text-decoration: none; margin-top: 6px;">
          ← Volver a la página principal / Crear cuenta
        </a>
      </div>
    </form>
  </div>
</div>
