<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada | Sistema de Ventas e Inventario</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/favicon.ico" />
  <style>
    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .error-card {
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
      color: #f8fafc;
      text-align: center;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      margin: 0;
      color: #0284c7;
      line-height: 1;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 1.5rem;
      margin: 15px 0 10px 0;
      color: #38bdf8;
      font-weight: 700;
    }

    .error-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-home {
      display: inline-block;
      padding: 12px 24px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-home:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }

    .footer-brand {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-title">Página no encontrada</div>
    <p class="error-desc">
      Lo sentimos, la dirección a la que intentas acceder no existe o ha sido movida.
    </p>
    <a href="index.html" class="btn-home">
      🏠 Volver al Sistema
    </a>
    <div class="footer-brand">
      <b>Sistema de Ventas e Inventario</b>
    </div>
  </div>

</body>

</html>
